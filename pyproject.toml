[project]
name = "colossus"
version = "0.1.0"
description = "Recurring automated cyberdefence system (M0 bootstrap)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic==2.14.3",
    "typer==0.29.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colossus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "docker: needs a local Docker daemon; runs only trusted fixture images",
]
